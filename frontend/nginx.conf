server {
    listen 80;
    root /usr/share/nginx/html;

    # /api/x -> backend /x, as vite.config.ts does in development. The frontend only ever
    # calls relative /api paths, so the browser sees one origin and no CORS is needed.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # LLM calls can take minutes (LLM_TIMEOUT_SECONDS defaults to 300).
        proxy_read_timeout 330s;
    }

    # Client-side routes (/drills, /stats, ...) all load index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
