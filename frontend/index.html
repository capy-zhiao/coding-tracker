<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coding Tracker</title>
    <!-- Apply the theme before first paint (mirrors src/lib/theme.ts): dark unless the
         user chose light -->
    <script>
      var t = 'dark'
      try { if (localStorage.getItem('theme') === 'light') t = 'light' } catch (e) {}
      if (t === 'dark') document.documentElement.classList.add('dark')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
