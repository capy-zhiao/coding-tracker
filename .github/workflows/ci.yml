name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  backend-postgres:
    name: Backend on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tracker
          POSTGRES_PASSWORD: tracker
          POSTGRES_DB: tracker
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tracker" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://tracker:tracker@localhost:5432/tracker
      TEST_DATABASE_URL: postgresql+psycopg://tracker:tracker@localhost:5432/tracker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-prod.txt

      - name: Migrations build exactly the schema the models describe
        run: python migrate.py && alembic check

      - name: The problem list loads
        run: python seed_db.py

      - name: Run tests on Postgres
        run: pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

  seed:
    name: Seed data integrity
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Problem set is complete and tagged
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "backend")
          from app.patterns import PATTERNS, PROBLEM_PATTERNS
          from app.study_plans import LC_75, PROBLEM_SET, TOP_150

          assert len(TOP_150) == 150, f"Top Interview 150 has {len(TOP_150)} problems"
          assert len(LC_75) == 75, f"LeetCode 75 has {len(LC_75)} problems"
          assert len(PROBLEM_SET) == 272, f"problem set has {len(PROBLEM_SET)} problems"
          untagged = PROBLEM_SET - set(PROBLEM_PATTERNS)
          assert not untagged, f"untagged problems: {sorted(untagged)}"
          unknown = {t for tags in PROBLEM_PATTERNS.values() for t in tags} - set(PATTERNS)
          assert not unknown, f"undefined pattern ids: {unknown}"
          print(f"OK: {len(PROBLEM_SET)} problems, {len(PATTERNS)} patterns, all tagged")
          PY
